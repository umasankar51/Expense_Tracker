<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Design.css">
<title>Insert title here</title>
<script src="SignIn.js"></script>
</head>
<body>
	<nav id="nav">
        <div id="left-nav">
            <div class="u-logo"><a href=""><img src="myLogo.png" alt="unisoars" id="logo"></a></div>
            <div class="web-name"><a href="homePage.html" id="WN">unisoars</a></div>
        </div>
    
    </nav>
    <main>
        <div class="sign-in-container">
            <h2>Sign In</h2>
             <form id="sign-in-form" action="SignIn"  >
                <label for="username"  class="l-name">User name:</label><br>
                <input type="text" id="username" name="username" required class="input-box" placeholder="username" ><br>
                <label for="password" class="l-name">Password:</label><br>
                <input type="password" id="password" name="password" required class="input-box" placeholder="password" ><br>
                <button type="submit">Sign In</button> <br>
                <a href="SignUp.html">If you don't have an account, sign up here.</a>
             </form>
        </div>
    </main>
    
</body>
</html>
